<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wann-FinTrack</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0f1720; --card:#17212b; --line:#2a3746;
    --ink:#eaf2fb; --sub:#8aa0b6;
    --brand:#e11d2a;
    --ok:#12b76a; --warn:#f5a524; --err:#ef4444;
    --tap:#1f2b38;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Sarabun","Segoe UI",system-ui,-apple-system,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{width:38px;height:38px;border-radius:10px;background:var(--brand);
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px}
  h1{font-size:18px;margin:0;line-height:1.2}
  h1 small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:12px}
  label{font-size:13px;color:var(--sub);display:block;margin:8px 0 4px}
  input[type=text],input[type=url]{width:100%;padding:12px;border-radius:10px;
    border:1px solid var(--line);background:#0d151d;color:var(--ink);font-size:15px}
  .btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;
    font-size:17px;font-weight:700;color:#fff;background:var(--brand);
    margin-top:10px;cursor:pointer}
  .btn.gray{background:var(--tap);color:var(--ink);border:1px solid var(--line)}
  .btn.ok{background:var(--ok)} .btn.small{padding:11px;font-size:15px}
  .row{display:flex;gap:8px} .row .btn{margin-top:0}
  #reader{border-radius:12px;overflow:hidden;margin-top:6px}
  .toggle{display:flex;align-items:center;justify-content:space-between;
    padding:10px 0;border-top:1px solid var(--line);margin-top:8px}
  .switch{position:relative;width:52px;height:30px;flex:0 0 auto}
  .switch input{display:none}
  .slider{position:absolute;inset:0;background:var(--tap);border-radius:30px;
    transition:.2s;border:1px solid var(--line)}
  .slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:2px;
    background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--ok)}
  .switch input:checked + .slider:before{transform:translateX(21px)}
  .result{text-align:center;padding:16px;border-radius:12px;margin-top:6px;display:none}
  .result .num{font-size:26px;font-weight:800;letter-spacing:1px;word-break:break-all}
  .result .msg{font-size:14px;margin-top:6px}
  .result.show{display:block}
  .result.ok{background:rgba(18,183,106,.12);border:1px solid var(--ok)}
  .result.warn{background:rgba(245,165,36,.12);border:1px solid var(--warn)}
  .result.err{background:rgba(239,68,68,.12);border:1px solid var(--err)}
  .logtitle{font-size:13px;color:var(--sub);margin:14px 0 6px;
    display:flex;justify-content:space-between}
  .logitem{display:flex;gap:8px;align-items:center;padding:9px 10px;
    background:#0d151d;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:14px}
  .logitem .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
  .logitem b{letter-spacing:.5px}
  .logitem span{color:var(--sub);font-size:12px;margin-left:auto}
  .hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
  .foldhead{cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .foldbody{display:none;margin-top:8px}
  .foldbody.open{display:block}
  .banner{padding:10px 12px;border-radius:10px;background:var(--tap);border:1px solid var(--line);
    font-size:14px;color:var(--sub);margin-bottom:10px;text-align:center}
  .banner.sel{background:rgba(18,183,106,.14);border-color:var(--ok);color:var(--ink);font-weight:700}
  #rowList{max-height:300px;overflow:auto;margin-top:8px}
  .rowitem{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:11px 12px;background:#0d151d;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
  .rowitem.sel{border-color:var(--ok);background:rgba(18,183,106,.10)}
  .rowitem.addnew{border-style:dashed;border-color:var(--brand)}
  .rowitem.addnew.sel{border-color:var(--ok);border-style:solid}
  .rowitem b{font-size:14px}
  .rowitem .rc{font-size:12px;color:var(--sub);margin-top:2px}
  .rowitem .tk{font-size:12px;color:var(--sub);letter-spacing:.3px;text-align:right}
  .rowitem .wait{font-size:12px;color:var(--warn);font-weight:700}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">FT</div>
    <h1>Wann-FinTrack<small>ยิงเลขแทร็คกิ้งเข้าชีต · แผนกการเงิน</small></h1>
  </header>

  <!-- ตั้งค่า -->
  <div class="card">
    <div class="foldhead" id="foldHead">
      <b>⚙️ ตั้งค่าการเชื่อมต่อ</b><span id="foldArrow">▸</span>
    </div>
    <div class="foldbody" id="foldBody">
      <label>ลิงก์ Web App (จาก Apps Script)</label>
      <input type="url" id="cfgUrl" placeholder="https://script.google.com/.../exec">
      <label>รหัสลับ (TOKEN)</label>
      <input type="text" id="cfgToken" placeholder="wann-scan-2026">
      <button class="btn ok small" id="saveCfg">บันทึกการตั้งค่า</button>
      <div class="hint">ตั้งครั้งเดียว เครื่องจะจำไว้ให้ (เก็บในเครื่องนี้เท่านั้น)</div>
    </div>
  </div>

  <!-- เลือกปลายทาง -->
  <div class="card">
    <button class="btn gray small" id="loadBtn">🔄 โหลดรายการแถวเดิมจากชีต</button>
    <div class="toggle">
      <span>แสดงเฉพาะแถวที่รอเลข</span>
      <label class="switch"><input type="checkbox" id="onlyBlank" checked><span class="slider"></span></label>
    </div>
    <div id="rowList"></div>
  </div>

  <!-- สแกน -->
  <div class="card">
    <div class="banner" id="targetBanner">โหมดอัตโนมัติ: เติมช่องว่างถัดไป</div>
    <button class="btn" id="startBtn">▶ เริ่มสแกน</button>
    <button class="btn gray" id="stopBtn" style="display:none">■ หยุดกล้อง</button>
    <div id="reader"></div>

    <div class="toggle">
      <span>ยืนยันก่อนส่ง (แนะนำ)</span>
      <label class="switch"><input type="checkbox" id="confirmToggle" checked><span class="slider"></span></label>
    </div>

    <div class="result" id="result">
      <div class="num" id="resNum"></div>
      <div class="msg" id="resMsg"></div>
      <div class="row" id="confirmRow" style="margin-top:12px;display:none">
        <button class="btn ok small" id="btnConfirm">✔ ยืนยันส่ง</button>
        <button class="btn gray small" id="btnCancel">✖ ยกเลิก</button>
      </div>
    </div>
  </div>

  <!-- ป้อนมือ -->
  <div class="card">
    <label>ป้อนเลขเอง (สำรอง)</label>
    <div class="row">
      <input type="text" id="manualInput" placeholder="RJ...TH">
      <button class="btn small" id="manualSend" style="width:auto;padding:12px 16px">ส่ง</button>
    </div>
  </div>

  <div class="logtitle"><span>ประวัติการยิงรอบนี้</span><span id="count">0 รายการ</span></div>
  <div id="log"></div>

</div>

<script>
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const cfg = { url: lsGet('scan_url') || '', token: lsGet('scan_token') || '' };
const $ = id => document.getElementById(id);
$('cfgUrl').value = cfg.url;
$('cfgToken').value = cfg.token;

const foldBody = $('foldBody'), foldArrow = $('foldArrow');
function setFold(open){ foldBody.classList.toggle('open',open); foldArrow.textContent = open?'▾':'▸'; }
setFold(!cfg.url);
$('foldHead').onclick = () => setFold(!foldBody.classList.contains('open'));
$('saveCfg').onclick = () => {
  cfg.url = $('cfgUrl').value.trim(); cfg.token = $('cfgToken').value.trim();
  lsSet('scan_url', cfg.url); lsSet('scan_token', cfg.token);
  setFold(false); toast('บันทึกแล้ว');
};

let audioCtx = null;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(.15, audioCtx.currentTime);
    o.start(); o.stop(audioCtx.currentTime + .12);
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(120); }catch(e){}
}

const sentThisSession = new Set();
let logCount = 0;
function showResult(kind, num, msg){
  const r = $('result'); r.className = 'result show ' + kind;
  $('resNum').textContent = num || ''; $('resMsg').textContent = msg || '';
}
function addLog(kind, num, note){
  logCount++; $('count').textContent = logCount + ' รายการ';
  const t = new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const el = document.createElement('div'); el.className = 'logitem';
  el.innerHTML = '<span class="dot '+kind+'"></span><b>'+num+'</b> '+(note||'')+'<span>'+t+'</span>';
  $('log').prepend(el);
}
function toast(m){ showResult('ok','',m); setTimeout(()=>$('result').classList.remove('show'),1500); }

/* ---------- เลือกปลายทาง ---------- */
let rowsData = [];
let selectedRow = null; // null=อัตโนมัติ | 'NEW'=ต่อแถวใหม่ | ตัวเลข=แถวนั้น

async function loadRows(){
  if(!cfg.url){ setFold(true); showResult('err','','ยังไม่ได้ตั้งค่าลิงก์ Web App'); return; }
  const list = $('rowList');
  list.innerHTML = '<div class="hint">กำลังโหลด...</div>';
  try{
    const res = await fetch(cfg.url, { method:'POST', body:new URLSearchParams({ token:cfg.token, action:'list' }) });
    const data = await res.json();
    if(data.ok){ rowsData = data.rows || []; renderRows(); }
    else { rowsData=[]; renderRows(); showResult('err','','โหลดไม่ได้: '+(data.msg||'')); }
  }catch(e){
    rowsData=[]; renderRows();
    showResult('err','','โหลดไม่ได้ — ถ้าเพิ่งแก้ Apps Script ต้อง Deploy เวอร์ชันใหม่ก่อน');
  }
}
function renderRows(){
  const list = $('rowList'); list.innerHTML = '';
  // ตัวเลือกถาวร: ต่อแถวใหม่
  const addNew = document.createElement('div');
  addNew.className = 'rowitem addnew' + (selectedRow==='NEW' ? ' sel':'');
  addNew.innerHTML = '<div><b>➕ เพิ่มเป็นแถวใหม่ด้านล่างสุด</b><div class="rc">ใช้เมื่อจดหมายฉบับนี้ยังไม่มีในชีต</div></div>';
  addNew.onclick = ()=>{ selectedRow='NEW'; renderRows(); updateBanner(); };
  list.appendChild(addNew);

  const onlyBlank = $('onlyBlank').checked;
  let shown = 0;
  rowsData.forEach(r=>{
    if(onlyBlank && r.track) return;
    shown++;
    const div = document.createElement('div');
    div.className = 'rowitem' + (selectedRow===r.row ? ' sel' : '');
    const right = r.track ? ('<span class="tk">'+escapeHtml(r.track)+'</span>') : '<span class="wait">รอเลข</span>';
    div.innerHTML = '<div><b>แถว '+r.row+'</b><div class="rc">'+escapeHtml(r.recipient||'')+'</div></div>'+right;
    div.onclick = ()=>{ selectedRow=r.row; renderRows(); updateBanner(); };
    list.appendChild(div);
  });
  if(!rowsData.length){
    const h=document.createElement('div'); h.className='hint';
    h.textContent='ยังไม่ได้โหลดรายการ — กด "โหลดรายการแถวเดิม" ถ้าจะลงแถวที่มีอยู่';
    list.appendChild(h);
  }else if(shown===0){
    const h=document.createElement('div'); h.className='hint';
    h.textContent='ทุกแถวมีเลขครบแล้ว (ปิดตัวกรองเพื่อดูทั้งหมด)';
    list.appendChild(h);
  }
}
function updateBanner(){
  const b = $('targetBanner');
  if(selectedRow==='NEW'){
    b.className='banner sel'; b.textContent='จะต่อแถวใหม่ด้านล่างสุด';
  }else if(selectedRow){
    const r = rowsData.find(x=>x.row===selectedRow);
    b.className='banner sel';
    b.textContent='จะลงแถวที่ '+selectedRow+(r&&r.recipient?(' — '+r.recipient):'');
  }else{
    b.className='banner'; b.textContent='โหมดอัตโนมัติ: เติมช่องว่างถัดไป';
  }
}
function advanceTarget(curRow){
  const idx = rowsData.findIndex(x=>x.row===curRow);
  let next = null;
  for(let i=idx+1;i<rowsData.length;i++){ if(!rowsData[i].track){ next = rowsData[i].row; break; } }
  selectedRow = next;
}
$('loadBtn').onclick = loadRows;
$('onlyBlank').onchange = renderRows;

/* ---------- ส่งเข้าชีต ---------- */
async function sendToSheet(code){
  if(!cfg.url){ setFold(true); showResult('err','','ยังไม่ได้ตั้งค่าลิงก์ Web App'); return; }
  if(sentThisSession.has(code)){ showResult('warn',code,'สแกนซ้ำในรอบนี้แล้ว'); return; }

  showResult('ok', code, 'กำลังส่ง...');
  busy = true;
  try{
    const params = { token:cfg.token, tracking:code };
    if(selectedRow==='NEW') params.mode='append';
    else if(selectedRow) params.row = selectedRow;

    const res = await fetch(cfg.url, { method:'POST', body:new URLSearchParams(params) });
    const data = await res.json();

    if(data.ok){
      sentThisSession.add(code);
      if(data.appended){
        rowsData.push({ row:data.row, recipient:'— แถวใหม่ —', track:code });
        showResult('ok', code, '✔ ต่อแถวใหม่ที่ '+data.row);
        addLog('ok', code, 'แถวใหม่ '+data.row);
      }else{
        const r = rowsData.find(x=>x.row===data.row);
        if(r) r.track = code;
        const note = data.overwrote ? ' (เขียนทับ)' : '';
        showResult('ok', code, '✔ ลงแถวที่ '+data.row+' — '+(data.recipient||'')+note);
        addLog('ok', code, 'แถว '+data.row);
        if(selectedRow && selectedRow!=='NEW') advanceTarget(data.row);
      }
      renderRows(); updateBanner();
    }else if(data.code==='DUP'){
      showResult('warn', code, '⚠ เลขนี้มีอยู่แล้ว (แถว '+(data.row||'?')+')');
      addLog('warn', code, 'ซ้ำ');
    }else if(data.code==='FULL'){
      showResult('warn', code, '⚠ ไม่มีช่องว่าง — แตะ ➕ ต่อแถวใหม่ หรือเลือกแถวด้านบน');
      addLog('warn', code, 'ไม่มีช่องว่าง');
    }else{
      showResult('err', code, '✖ '+(data.msg||'ส่งไม่สำเร็จ'));
      addLog('err', code, data.code||'ผิดพลาด');
    }
  }catch(err){
    sentThisSession.add(code);
    showResult('warn', code, 'ส่งแล้ว แต่ยืนยันผลไม่ได้ — เช็คในชีตอีกที');
    addLog('warn', code, 'ส่งแล้ว(ไม่ยืนยัน)');
  }finally{
    busy = false;
  }
}

/* ---------- ยืนยัน + กันสแกนรัว ---------- */
let pendingCode = null;
let lastCode = null, lastAt = 0, busy = false;
function handleScan(code){
  code = (code||'').trim().toUpperCase();
  if(!code) return;
  const now = Date.now();
  if(busy || pendingCode) return;
  if(code === lastCode && now - lastAt < 3000) return;
  lastCode = code; lastAt = now;
  beep();
  if($('confirmToggle').checked){
    pendingCode = code;
    showResult('ok', code, 'ตรวจเลขให้ถูก แล้วกดยืนยัน');
    $('confirmRow').style.display = 'flex';
    pauseScan();
  }else{
    sendToSheet(code);
  }
}
$('btnConfirm').onclick = () => {
  $('confirmRow').style.display='none';
  const c = pendingCode; pendingCode=null;
  sendToSheet(c); resumeScan();
};
$('btnCancel').onclick = () => {
  $('confirmRow').style.display='none'; pendingCode=null;
  $('result').classList.remove('show'); resumeScan();
};

/* ---------- กล้อง ---------- */
let qr = null, running = false;
const fmt = (typeof Html5QrcodeSupportedFormats!=='undefined') ? [
  Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.QR_CODE
] : undefined;
function qrbox(w,h){ const min=Math.min(w,h); const width=Math.floor(Math.min(320,min*0.9)); return {width:width,height:Math.floor(width*0.55)}; }
async function startScan(){
  if(running) return;
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  qr = new Html5Qrcode("reader", { formatsToSupport: fmt, verbose:false });
  try{
    await qr.start({ facingMode:"environment" }, { fps:10, qrbox:qrbox, aspectRatio:1.4 },
      (decoded)=>handleScan(decoded), ()=>{});
    running = true; $('startBtn').style.display='none'; $('stopBtn').style.display='block';
  }catch(err){
    showResult('err','','เปิดกล้องไม่ได้: '+err+' (ต้องเปิดผ่าน https และอนุญาตกล้อง)');
  }
}
async function stopScan(){
  if(!qr||!running) return;
  try{ await qr.stop(); await qr.clear(); }catch(e){}
  running=false; $('startBtn').style.display='block'; $('stopBtn').style.display='none';
}
function pauseScan(){ try{ qr && running && qr.pause(true); }catch(e){} }
function resumeScan(){ try{ qr && running && qr.resume(); }catch(e){} }
$('startBtn').onclick = startScan;
$('stopBtn').onclick  = stopScan;

$('manualSend').onclick = () => {
  const v = $('manualInput').value.trim().toUpperCase();
  if(v){ sendToSheet(v); $('manualInput').value=''; }
};

/* เริ่มต้น: โชว์ปุ่ม ➕ ต่อแถวใหม่ ทันที */
renderRows(); updateBanner();
</script>
</body>
</html>
